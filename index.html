<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник самочувствия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px; width: 100%; max-width: 400px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px; box-sizing: border-box;
        }
        h2 { margin-top: 0; text-align: center; font-size: 20px; }
        .btn-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 15px 0; border-radius: 15px; border: none; font-size: 24px;
            cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-good { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .btn-normal { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .btn-bad { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .title { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Как вы сейчас?</h2>
        <div class="btn-row">
            <button class="btn btn-good" onclick="send('good')">🟢<span class="title">Отлично</span></button>
            <button class="btn btn-normal" onclick="send('normal')">🟡<span class="title">Нормально</span></button>
            <button class="btn btn-bad" onclick="send('bad')">🔴<span class="title">Плохо</span></button>
        </div>
    </div>

    <div class="card" style="padding: 15px 10px;">
        <canvas id="diaryChart"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function send(status) {
            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify({ action: 'add_diary', status: status }));
            tg.close();
        }

        // Получаем данные из ссылки от бота
        const hash = window.location.hash.substring(1);
        if (hash) {
            try {
                const data = JSON.parse(decodeURIComponent(hash));
                const ctx = document.getElementById('diaryChart').getContext('2d');
                
                const colors = data.map(d => {
                    if(d.s === 'good') return '#43e97b';
                    if(d.s === 'normal') return '#f6d365';
                    return '#ff0844';
                });

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.t),
                        datasets: [{
                            label: 'Уровень бури (Kp)',
                            data: data.map(d => d.k),
                            borderColor: 'rgba(255, 255, 255, 0.2)',
                            pointBackgroundColor: colors,
                            pointBorderColor: '#fff',
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            borderWidth: 2,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { min: 0, max: 9, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255,255,255,0.7)' } },
                            x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.7)' } }
                        }
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
